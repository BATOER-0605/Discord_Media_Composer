<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#5865F2" />
    <title>Discord Media Composer</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="card">
      <h1>Discord Media Composer</h1>
      <p class="lead" id="lead">動画・写真を Discord 用に圧縮します。</p>

      <form id="form">
        <label class="picker" id="picker">
          <input
            type="file"
            id="file"
            name="media"
            accept="image/*,video/*"
            hidden
          />
          <span class="picker-icon">＋</span>
          <span class="picker-text">タップして写真・動画を選択</span>
        </label>

        <div class="filemeta" id="filemeta" hidden></div>

        <button type="submit" id="submit" class="btn" disabled>圧縮する</button>
      </form>

      <section class="progress-wrap" id="progressWrap" hidden>
        <div class="status" id="status">準備中…</div>
        <progress id="bar" max="100" value="0"></progress>
        <div class="pct" id="pct">0%</div>
      </section>

      <section class="result" id="result" hidden>
        <div class="result-msg" id="resultMsg"></div>
        <a class="btn download" id="download" download>ダウンロード</a>
        <button type="button" class="btn ghost" id="again">もう一度</button>
      </section>

      <div class="error" id="error" hidden></div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
